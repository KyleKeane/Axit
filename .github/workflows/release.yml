# Builds the zip that publish.ps1 builds locally and attaches it to a GitHub release, with install.cmd on its own so
# it can be downloaded alone and install the latest release. The apps install updates from these releases (docs/axit/SPEC.md
# AX-3). Started by pushing a version tag, which release.ps1 does, or by hand from the
# Actions tab (or `gh workflow run release.yml -f tag=v1.0.1`) for a tag that already exists.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release, for example v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The SDK band is global.json's, the one place it is set (docs/axit/longevity.md).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check the tag against the project version
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          $version = $tag -replace '^v', ''
          $projectVersion = (Select-Xml -Path src/Axit/Axit.csproj -XPath '/Project/PropertyGroup/Version').Node.InnerText
          if ($projectVersion -ne $version) {
            Write-Host "Tag $tag does not match <Version>$projectVersion</Version> in Axit.csproj. Release with release.ps1, which sets both."
            exit 1
          }
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test Axit.sln --configuration Release --nologo

      - name: Publish
        shell: pwsh
        run: .\publish.ps1 -NoInstall

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          .\tools\release-notes.ps1 -Version $env:VERSION | Set-Content -Path notes.md -Encoding utf8
          # The SDK that built this release, so that a rebuild years later knows what to reproduce (docs/axit/longevity.md).
          Add-Content -Path notes.md -Value "`nBuilt with the .NET SDK $(dotnet --version)." -Encoding utf8

      # The release is made as a draft and published only once its files are up: the apps' update check reads the
      # latest published release (AX-3), and a window that checked while the zip was still uploading downloaded a
      # half-written file and reported "The installer failed" (2026-10-21).
      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-Item "publish\Axit-$env:VERSION-win-x64.zip").FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip install.cmd --clobber
          } else {
            gh release create $env:TAG $zip install.cmd --title "Axit $env:VERSION" --notes-file notes.md --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:TAG --draft=false
          }
