name: Build

on:
  # Every branch, so that work on a branch fails here before it is merged rather than at its release (AX-4.4).
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: dotnet test Axit.sln --configuration Release --nologo
